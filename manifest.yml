modules:
  jira:projectPage:
    - key: planning-poker-project-page
      resource: planning-poker-ui
      resolver:
        function: planning-poker-backend
      title: Planning Poker
      layout: basic
  function:
    - key: planning-poker-backend
      handler: index.handler
    - key: planning-poker-cleanup
      handler: cleanup.handler
  scheduledTrigger:
    - key: planning-poker-cleanup-trigger
      function: planning-poker-cleanup
      interval: day
resources:
  - key: planning-poker-ui
    path: static/planning-poker-ui/dist
app:
  id: ari:cloud:ecosystem::app/cdd0e543-34ee-4766-9a8c-b83151acc5f8
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
  content:
    styles:
      - "unsafe-inline"
  external:
    fetch:
      backend:
        - https://relay.alptalha.dev
        - wss://relay.alptalha.dev
      client:
        - https://relay.alptalha.dev
        - wss://relay.alptalha.dev
